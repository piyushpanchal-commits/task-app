<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Task List</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 520px; margin: 40px auto; padding: 0 16px; background: #f6f7f9; color: #222; }
    h1 { font-size: 24px; }
    form { display: flex; gap: 8px; margin-bottom: 16px; }
    input[type="text"] { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; }
    button { padding: 8px 12px; border: none; border-radius: 6px; cursor: pointer; background: #2563eb; color: white; }
    button.secondary { background: #e5e7eb; color: #222; }
    button.danger { background: #dc2626; }
    li { display: flex; align-items: center; gap: 8px; background: white; padding: 10px; border-radius: 6px; margin-bottom: 8px; list-style: none; }
    li span { flex: 1; }
    li.done span { text-decoration: line-through; color: #888; }
    ul { padding: 0; }
  </style>
</head>
<body>
  <h1>My Task List</h1>

  <!-- CREATE: the form to add a new task -->
  <form id="task-form">
    <input type="text" id="task-input" placeholder="What needs doing?" required>
    <button type="submit">Add</button>
  </form>

  <!-- READ: tasks are shown here -->
  <ul id="task-list"></ul>

  <script>
    // Tasks are saved in the browser (localStorage), so they survive a page refresh.
    let tasks = JSON.parse(localStorage.getItem("tasks") || "[]");

    function save() {
      localStorage.setItem("tasks", JSON.stringify(tasks));
    }

    // READ: draw every task on the page
    function render() {
      const list = document.getElementById("task-list");
      list.innerHTML = "";
      tasks.forEach((task, index) => {
        const li = document.createElement("li");
        if (task.done) li.className = "done";
        li.innerHTML = `
          <input type="checkbox" ${task.done ? "checked" : ""} onchange="toggleTask(${index})">
          <span></span>
          <button class="secondary" onclick="editTask(${index})">Edit</button>
          <button class="danger" onclick="deleteTask(${index})">Delete</button>
        `;
        li.querySelector("span").textContent = task.text;
        list.appendChild(li);
      });
    }

    // CREATE: add a new task
    document.getElementById("task-form").addEventListener("submit", (event) => {
      event.preventDefault();
      const input = document.getElementById("task-input");
      tasks.push({ text: input.value.trim(), done: false });
      input.value = "";
      save();
      render();
    });

    // UPDATE: change a task's text
    function editTask(index) {
      const newText = prompt("Edit task:", tasks[index].text);
      if (newText && newText.trim()) {
        tasks[index].text = newText.trim();
        save();
        render();
      }
    }

    // UPDATE: mark a task done / not done
    function toggleTask(index) {
      tasks[index].done = !tasks[index].done;
      save();
      render();
    }

    // DELETE: remove a task
    function deleteTask(index) {
      tasks.splice(index, 1);
      save();
      render();
    }

    render();
  </script>
</body>
</html>
